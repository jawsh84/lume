<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9998;</text></svg>">
<title>Lume</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sidebar-w: 260px;
    --bg: #fafaf9;
    --sidebar-bg: #f5f5f4;
    --border: #e7e5e4;
    --text: #1c1917;
    --text-muted: #78716c;
    --accent: #2b6cb0;
    --accent-hover: #1e5a94;
    --file-entry-hover: #e7e5e4;
    --code-bg: #f0efe9;
    --pre-bg: #1e1e1e;
    --pre-text: #d4d4d4;
  }

  html.dark {
    --bg: #292c33;
    --sidebar-bg: #242730;
    --border: #3e4250;
    --text: #eaeaea;
    --text-muted: #c5c8c6;
    --accent: #88a1bb;
    --accent-hover: #83a5d6;
    --file-entry-hover: #33363f;
    --code-bg: #33363f;
    --pre-bg: #1d1f21;
    --pre-text: #c5c8c6;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ---- Sidebar ---- */
  #sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #sidebar-header {
    padding: 16px;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.02em;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #sidebar-header .logo { opacity: 0.7; }

  #breadcrumb {
    padding: 8px 16px;
    font-size: 12px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }

  #breadcrumb span {
    cursor: pointer;
  }

  #breadcrumb span:hover { color: var(--accent); }

  #file-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }

  .file-entry {
    padding: 8px 16px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-left: 3px solid transparent;
    transition: background 0.1s;
  }

  .file-entry:hover { background: var(--file-entry-hover); }
  .file-entry.active { border-left-color: var(--accent); background: var(--file-entry-hover); }
  .file-entry .icon { opacity: 0.5; font-size: 13px; }

  /* ---- Main ---- */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  #toolbar {
    padding: 8px 16px;
    padding-top: max(8px, env(safe-area-inset-top));
    display: flex;
    align-items: center;
    background: var(--bg);
    position: relative;
  }

  #file-path {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    pointer-events: auto;
  }

  #status {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    margin-left: auto;
  }

  #editor-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 32px;
    display: flex;
    justify-content: center;
  }

  #editor {
    max-width: 720px;
    width: 100%;
    font-size: 16px;
    line-height: 1.7;
    outline: none;
  }

  /* Milkdown prose styles */
  #editor h1 { font-size: 2em; margin: 0.8em 0 0.4em; font-weight: 700; }
  #editor h2 { font-size: 1.5em; margin: 0.7em 0 0.3em; font-weight: 600; }
  #editor h3 { font-size: 1.2em; margin: 0.6em 0 0.3em; font-weight: 600; }
  #editor p { margin: 0.5em 0; }
  #editor ul, #editor ol { margin: 0.5em 0; padding-left: 1.5em; }
  #editor li { margin: 0.2em 0; }
  #editor blockquote {
    border-left: 3px solid var(--border);
    padding-left: 1em;
    color: var(--text-muted);
    margin: 0.5em 0;
  }
  #editor pre {
    background: var(--pre-bg);
    color: var(--pre-text);
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 14px;
    margin: 0.8em 0;
  }
  #editor code {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
  }
  #editor pre code { background: none; padding: 0; }
  .ProseMirror { white-space: pre-wrap; outline: none; min-height: 100%; }
  .ProseMirror::after { content: ''; display: block; height: 40px; }
  #editor a { color: var(--accent); }
  #editor.mod-held a { cursor: pointer; text-decoration: underline; }
  #editor hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }
  #editor img { max-width: 100%; border-radius: 8px; }
  #editor table { border-collapse: collapse; margin: 0.8em 0; width: 100%; }
  #editor th, #editor td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  #editor th { background: var(--sidebar-bg); font-weight: 600; }

  /* ---- Empty state ---- */
  #empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 15px;
  }

  #sidebar-close { display: none; }

  /* ---- Mobile ---- */
  @media (max-width: 768px) {
    #sidebar { display: none; }
    #sidebar.open {
      display: flex;
      position: fixed;
      z-index: 10;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100dvh;
      min-width: 100vw !important;
      border-right: none;
    }
    #sidebar.open #sidebar-close {
      display: inline;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      margin-left: auto;
      padding: 4px;
    }
    #editor-wrap { padding: 16px; }
  }

  #menu-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    padding: 4px 8px;
    cursor: pointer;
    font-size: 16px;
    position: relative;
    z-index: 1;
  }

  #sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
  }

  #theme-toggle {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    padding: 4px 8px;
    cursor: pointer;
    font-size: 13px;
    width: 100%;
  }

  #sidebar.collapsed { display: none; }

  /* ---- Settings Modal ---- */
  #settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #settings-modal {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 90%;
    max-width: 520px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 24px;
  }

  #settings-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  #settings-header h2 { font-size: 1.3em; font-weight: 700; }

  #settings-close {
    background: none;
    border: none;
    font-size: 24px;
    color: var(--text-muted);
    cursor: pointer;
  }

  .settings-hint {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .folder-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--sidebar-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 8px;
    font-size: 14px;
  }

  .folder-item .folder-path {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .folder-item .folder-status {
    font-size: 11px;
    color: var(--text-muted);
    margin: 0 8px;
    flex-shrink: 0;
  }

  .folder-item .remove-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 2px 8px;
    font-size: 12px;
    flex-shrink: 0;
  }

  .folder-item .remove-btn:hover { color: #e53e3e; border-color: #e53e3e; }

  @keyframes folder-added {
    from { background: var(--accent); color: white; }
    to { background: var(--sidebar-bg); color: var(--text); }
  }
  .folder-item.just-added { animation: folder-added 0.6s ease-out; }

  #browse-btn {
    width: 100%;
    padding: 8px 16px;
    background: none;
    color: var(--accent);
    border: 1px dashed var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    margin-top: 8px;
  }

  #browse-btn:hover { border-color: var(--accent); }

  #folder-browser {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-top: 12px;
    overflow: hidden;
  }

  #browser-header {
    padding: 8px 12px;
    font-size: 12px;
    color: var(--text-muted);
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--border);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: rtl;
    text-align: left;
  }

  #browser-list {
    max-height: 200px;
    overflow-y: auto;
  }

  .browser-entry {
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .browser-entry:hover { background: var(--file-entry-hover); }
  .browser-entry .icon { opacity: 0.5; font-size: 12px; }

  #browser-actions {
    display: flex;
    gap: 8px;
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    justify-content: flex-end;
  }

  #browser-actions button {
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    border: 1px solid var(--border);
    background: none;
    color: var(--text);
  }

  #browser-actions .select-btn {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  #settings-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    padding: 4px 8px;
    cursor: pointer;
    font-size: 13px;
    width: 100%;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<div id="sidebar" class="collapsed">
  <div id="sidebar-header"><span class="logo">&#9998;</span> Lume <button id="sidebar-close" onclick="toggleSidebar()">&#10005;</button></div>
  <div id="breadcrumb"></div>
  <div id="file-list"></div>
  <div id="sidebar-footer">
    <button id="settings-btn" onclick="openSettings()">&#9881; Settings</button>
    <button id="theme-toggle" onclick="toggleTheme()"></button>
  </div>
</div>

<div id="main">
  <div id="toolbar">
    <button id="menu-btn" onclick="toggleSidebar()">&#9776;</button>
    <span id="file-path">No file open</span>
    <span id="status"></span>
  </div>
  <div id="editor-wrap">
    <div id="empty-state">Select a file from the sidebar to begin editing</div>
    <div id="editor" style="display:none"></div>
  </div>
</div>

<!-- Settings Modal -->
<div id="settings-overlay" style="display:none">
  <div id="settings-modal">
    <div id="settings-header">
      <h2>Settings</h2>
      <button id="settings-close" onclick="closeSettings()">&times;</button>
    </div>
    <div id="settings-body">
      <h3 style="font-size:1em;margin-bottom:4px">Knowledge Base Folders</h3>
      <p class="settings-hint">Add folders containing your markdown files.</p>
      <div id="folder-list"></div>
      <button id="browse-btn" onclick="openBrowser()">+ Add Folder</button>
      <div id="folder-browser" style="display:none">
        <div id="browser-header"><span id="browser-path"></span></div>
        <div id="browser-list"></div>
        <div id="browser-actions">
          <button onclick="cancelBrowser()">Cancel</button>
          <button class="select-btn" onclick="selectCurrentFolder()">Select This Folder</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Theme toggle (runs before render to avoid flash) -->
<script>
function getTheme() {
  return localStorage.getItem('theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
function applyTheme(theme) {
  document.documentElement.classList.toggle('dark', theme === 'dark');
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = theme === 'dark' ? '☼ Light' : '☽ Dark';
}
function toggleTheme() {
  const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
}
applyTheme(getTheme());
</script>

<!-- Settings logic (non-module so onclick handlers work immediately) -->
<script>
async function loadFolderList(highlightLast) {
  const res = await fetch('/api/config');
  const data = await res.json();
  const list = document.getElementById('folder-list');
  list.innerHTML = '';
  if (data.folders.length === 0) {
    list.innerHTML = '<p class="settings-hint">No folders added yet.</p>';
    return;
  }
  data.folders.forEach(function(folder, i) {
    const div = document.createElement('div');
    div.className = 'folder-item';
    if (highlightLast && i === data.folders.length - 1) div.classList.add('just-added');
    const status = folder.exists ? '' : '<span class="folder-status">(missing)</span>';
    div.innerHTML = '<span class="folder-path" title="' + folder.path + '">' + folder.path + '</span>' + status + '<button class="remove-btn">Remove</button>';
    div.querySelector('.remove-btn').onclick = function() { removeFolder(folder.path); };
    list.appendChild(div);
  });
}

function openSettings() {
  document.getElementById('settings-overlay').style.display = 'flex';
  loadFolderList();
}

function closeSettings() {
  document.getElementById('settings-overlay').style.display = 'none';
  if (window._reloadSidebar) window._reloadSidebar();
}

async function removeFolder(path) {
  if (!confirm('Remove "' + path + '" from your knowledge base?')) return;
  const res = await fetch('/api/config/folders/remove', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: path }),
  });
  const data = await res.json();
  if (data.error) { alert(data.error); return; }
  await loadFolderList();
}

// ---- Folder browser ----
var _browserPath = null;

function openBrowser() {
  document.getElementById('folder-browser').style.display = '';
  document.getElementById('browse-btn').style.display = 'none';
  loadBrowserDir();
}

function cancelBrowser() {
  document.getElementById('folder-browser').style.display = 'none';
  document.getElementById('browse-btn').style.display = '';
}

async function loadBrowserDir(path) {
  var params = path ? '?path=' + encodeURIComponent(path) : '';
  var res = await fetch('/api/browse' + params);
  var data = await res.json();
  if (data.error) return;
  _browserPath = data.path;
  document.getElementById('browser-path').textContent = data.path;

  var list = document.getElementById('browser-list');
  list.innerHTML = '';

  // Parent directory
  var parts = data.path.split('/').filter(Boolean);
  if (parts.length > 0) {
    var parent = '/' + parts.slice(0, -1).join('/');
    var up = document.createElement('div');
    up.className = 'browser-entry';
    up.innerHTML = '<span class="icon">..</span>';
    up.onclick = function() { loadBrowserDir(parent || '/'); };
    list.appendChild(up);
  }

  data.entries.forEach(function(entry) {
    var div = document.createElement('div');
    div.className = 'browser-entry';
    div.innerHTML = '<span class="icon">&#128193;</span> ' + entry.name;
    div.onclick = function() { loadBrowserDir(entry.path); };
    list.appendChild(div);
  });
}

async function selectCurrentFolder() {
  if (!_browserPath) return;
  var res = await fetch('/api/config/folders/add', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: _browserPath }),
  });
  var data = await res.json();
  if (data.error) { alert(data.error); return; }
  cancelBrowser();
  await loadFolderList(true);
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('folder-browser').style.display !== 'none') {
      cancelBrowser();
    } else if (document.getElementById('settings-overlay').style.display !== 'none') {
      closeSettings();
    }
  }
});
</script>

<!-- Milkdown (local bundle) -->
<script src="/editor.bundle.js" type="module"></script>
<script type="module">
// Wait for bundle to load if needed
if (!window.Milkdown) {
  await new Promise(r => window.addEventListener('milkdown-ready', r));
}
const {
  Editor,
  rootCtx,
  defaultValueCtx,
  editorViewCtx,
  serializerCtx,
  commonmark,
  gfm,
  history: milkdownHistory,
  listener,
  listenerCtx,
} = window.Milkdown;

// ---- Sidebar toggle ----
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  if (window.innerWidth <= 768) {
    sidebar.classList.remove('collapsed');
    sidebar.classList.toggle('open');
  } else {
    sidebar.classList.toggle('collapsed');
  }
}
window.toggleSidebar = toggleSidebar;

// ---- State ----
let currentPath = null;
let editor = null;
let ws = null;
let dirty = false;
let skipNextReload = false;

// ---- Helpers ----
function setStatus(msg) { document.getElementById('status').textContent = msg; }
function setDirty(v) {
  dirty = v;
}

// ---- Auto-save ----
let autoSaveTimer = null;
function scheduleAutoSave() {
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => window.save(), 1500);
}

// ---- Editor ----
let ignoreNextUpdate = false;

async function createEditor(markdown) {
  const el = document.getElementById('editor');
  el.style.display = '';
  el.innerHTML = '';
  document.getElementById('empty-state').style.display = 'none';

  ignoreNextUpdate = true;
  editor = await Editor.make()
    .config((ctx) => {
      ctx.set(rootCtx, el);
      ctx.set(defaultValueCtx, markdown);
      ctx.get(listenerCtx).markdownUpdated((_, md) => {
        if (ignoreNextUpdate) { ignoreNextUpdate = false; return; }
        setDirty(true);
        scheduleAutoSave();
      });
    })
    .use(commonmark)
    .use(gfm)
    .use(milkdownHistory)
    .use(listener)
    .create();

  setDirty(false);
}

const editorEl = document.getElementById('editor');

const SCHEME_RE = /^[a-z][a-z0-9+.\-]*:/i;

editorEl.addEventListener('click', async (e) => {
  const a = e.target.closest('a');
  if (!a) return;
  const raw = a.getAttribute('href');
  if (!raw) return;
  // Anchor: let the browser handle in-page scroll
  if (raw.startsWith('#')) return;
  // External: let the browser handle (plain click follows link, cmd+click opens new tab)
  if (SCHEME_RE.test(raw)) return;

  // Internal candidate — take over from the browser
  e.preventDefault();
  if (!currentPath) return;

  let resolved;
  try {
    const res = await fetch('/api/resolve?' + new URLSearchParams({ href: raw, from: currentPath }));
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      console.warn('Lume: could not resolve link', raw, data.error || res.status);
      return;
    }
    resolved = (await res.json()).path;
  } catch (err) {
    console.warn('Lume: resolve error', raw, err);
    return;
  }

  if (e.metaKey || e.ctrlKey) {
    window.open('/edit?path=' + encodeURIComponent(resolved), '_blank', 'noopener');
  } else {
    openFile(resolved);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Meta' || e.key === 'Control') editorEl.classList.add('mod-held');
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'Meta' || e.key === 'Control') editorEl.classList.remove('mod-held');
});
window.addEventListener('blur', () => editorEl.classList.remove('mod-held'));

function getMarkdown() {
  if (!editor) return '';
  const ctx = editor.ctx;
  const view = ctx.get(editorViewCtx);
  const serializer = ctx.get(serializerCtx);
  return serializer(view.state.doc);
}

// ---- File operations ----
// history: 'push' (default, new nav), 'replace' (initial load), 'none' (popstate)
async function openFile(path, { history = 'push' } = {}) {
  const res = await fetch('/api/read?' + new URLSearchParams({ path }));
  const data = await res.json();
  if (data.error) { alert(data.error); return; }

  currentPath = data.path;
  const filePathEl = document.getElementById('file-path');
  filePathEl.textContent = currentPath.split('/').pop();
  filePathEl.title = currentPath;
  document.title = currentPath.split('/').pop();

  const url = '/edit?path=' + encodeURIComponent(currentPath);
  if (history === 'push') {
    window.history.pushState({ path: currentPath }, '', url);
  } else if (history === 'replace') {
    window.history.replaceState({ path: currentPath }, '', url);
  }

  await createEditor(data.content);
  connectWS(currentPath);

  // Highlight active file in sidebar
  document.querySelectorAll('.file-entry').forEach(e => {
    e.classList.toggle('active', e.dataset.path === currentPath);
  });
}

window.addEventListener('popstate', (e) => {
  const path = e.state?.path;
  if (path) openFile(path, { history: 'none' });
});

window.save = async function() {
  clearTimeout(autoSaveTimer);
  if (!currentPath || !dirty) return;
  const md = getMarkdown();
  setStatus('Saving...');
  const res = await fetch('/api/write', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: currentPath, content: md }),
  });
  const data = await res.json();
  if (data.ok) {
    setDirty(false);
    skipNextReload = true;
    setStatus('Saved');
    setTimeout(() => setStatus(''), 2000);
  } else {
    setStatus('Error saving');
  }
};

// Ctrl+S / Cmd+S
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    window.save();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
    e.preventDefault();
    toggleSidebar();
  }
});

// ---- WebSocket for live reload ----
function connectWS(path) {
  if (ws) ws.close();
  let reconnectDelay = 1000;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';

  function connect() {
    ws = new WebSocket(`${proto}://${location.host}/ws?path=${encodeURIComponent(path)}`);

    ws.onopen = () => { reconnectDelay = 1000; };

    ws.onmessage = async (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'reload' && msg.path === currentPath) {
        if (skipNextReload) { skipNextReload = false; return; }
        if (dirty) return;
        setStatus('Reloading...');
        const res = await fetch('/api/read?' + new URLSearchParams({ path: currentPath }));
        const data = await res.json();
        if (!data.error) {
          await createEditor(data.content);
          setStatus('Updated from disk');
          setTimeout(() => setStatus(''), 2000);
        }
      }
    };

    ws.onclose = () => {
      if (path === currentPath) {
        setTimeout(() => { if (path === currentPath) connect(); }, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, 30000);
      }
    };
  }

  connect();
}

document.addEventListener('visibilitychange', async () => {
  if (!document.hidden && currentPath && !dirty) {
    const res = await fetch('/api/read?' + new URLSearchParams({ path: currentPath }));
    const data = await res.json();
    if (!data.error) {
      const current = getMarkdown();
      if (data.content !== current) {
        await createEditor(data.content);
        setStatus('Updated from disk');
        setTimeout(() => setStatus(''), 2000);
      }
    }
  }
});

// ---- Sidebar / file browser ----
let _rootPaths = null;  // cached list of root folder paths

async function getRootPaths() {
  if (_rootPaths) return _rootPaths;
  const res = await fetch('/api/config');
  const data = await res.json();
  _rootPaths = data.folders.map(f => f.path);
  return _rootPaths;
}

async function loadDir(path) {
  const params = path ? { path } : {};
  const res = await fetch('/api/ls?' + new URLSearchParams(params));
  const data = await res.json();
  if (data.error) return;

  const bc = document.getElementById('breadcrumb');
  const list = document.getElementById('file-list');
  list.innerHTML = '';

  if (data.is_virtual_root) {
    _rootPaths = data.entries.map(e => e.path);  // refresh cache
    // If only one root folder, skip virtual root and go directly into it
    if (data.entries.length === 1) {
      loadDir(data.entries[0].path);
      return;
    }
    // Top-level: show configured root folders
    bc.innerHTML = '<span>Knowledge Base</span>';
    data.entries.forEach(entry => {
      const div = document.createElement('div');
      div.className = 'file-entry';
      div.dataset.path = entry.path;
      div.innerHTML = `<span class="icon">&#128193;</span> ${entry.name}`;
      div.onclick = () => loadDir(entry.path);
      list.appendChild(div);
    });
    return;
  }

  // Breadcrumb with home link
  const parts = data.path.split('/').filter(Boolean);
  bc.innerHTML = '';
  const home = document.createElement('span');
  home.textContent = '\u2302';
  home.onclick = () => loadDir();
  bc.appendChild(home);

  let accumulated = '/';
  parts.forEach((part, i) => {
    const sep = document.createElement('span');
    sep.textContent = ' / ';
    bc.appendChild(sep);
    const sp = document.createElement('span');
    accumulated += part + '/';
    sp.textContent = part;
    const navPath = accumulated;
    sp.onclick = () => loadDir(navPath);
    bc.appendChild(sp);
  });

  // Parent directory link
  const roots = await getRootPaths();
  const isAtRoot = roots.includes(data.path);
  const parentDiv = document.createElement('div');
  parentDiv.className = 'file-entry';
  parentDiv.innerHTML = '<span class="icon">..</span>';
  if (isAtRoot) {
    parentDiv.onclick = () => loadDir();
  } else {
    const parent = '/' + parts.slice(0, -1).join('/');
    parentDiv.onclick = () => loadDir(parent);
  }
  list.appendChild(parentDiv);

  data.entries.forEach(entry => {
    const div = document.createElement('div');
    div.className = 'file-entry';
    div.dataset.path = entry.path;
    if (entry.path === currentPath) div.classList.add('active');
    const icon = entry.is_dir ? '&#128193;' : '&#128196;';
    div.innerHTML = `<span class="icon">${icon}</span> ${entry.name}`;
    div.onclick = () => {
      if (entry.is_dir) { loadDir(entry.path); }
      else { openFile(entry.path); if (window.innerWidth <= 768) toggleSidebar(); }
    };
    list.appendChild(div);
  });
}

// Wire up settings close -> sidebar refresh
window._reloadSidebar = () => { _rootPaths = null; loadDir(); };

// ---- Init ----
const params = new URLSearchParams(window.location.search);
if (params.get('path')) {
  // Determine parent dir for sidebar
  const filePath = params.get('path');
  const parentDir = filePath.substring(0, filePath.lastIndexOf('/'));
  loadDir(parentDir);
  openFile(filePath, { history: 'replace' });
} else {
  loadDir();
}
if (window.location.pathname === '/settings') {
  openSettings();
}
</script>
